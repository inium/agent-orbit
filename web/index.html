<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — AI Workspace</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="assets/js/app.js"></script>
    <link href="assets/fonts/pretendard/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body class="bg-white text-slate-800" x-data="orbitTheme">
    <div class="flex h-screen overflow-hidden" x-data="chatApp()">
      <aside
        class="w-64 shrink-0 border-r border-slate-200 bg-[#f8f9fc] p-4 flex-col fixed left-0 inset-y-0 z-20 lg:static"
        :class="roomsOpen ? 'flex' : 'hidden lg:flex'"
        aria-label="대화방 목록"
      >
        <a
          href="#"
          aria-label="Orbit"
          @click.prevent="$refs.input.focus()"
          class="flex items-center gap-2.5 px-2 pt-2 pb-7 text-2xl font-bold tracking-tight"
        >
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-indigo-600 text-2xl text-white" aria-hidden="true"
            >✳</span
          >
          orbit
          <!-- <span class="rounded-2xl border px-1.5 text-[10px] font-medium tracking-normal text-slate-400">BETA</span> -->
        </a>
        <div class="flex items-center justify-between mb-5">
          <button @click="roomsOpen=false" class="lg:hidden text-slate-400" aria-label="대화방 목록 닫기">✕</button>
        </div>
        <button @click="createRoom()" class="bg-indigo-600 text-white rounded-lg p-3 text-sm font-semibold">
          ＋ 새로운 대화
        </button>
        <div class="mt-5 flex-1 overflow-y-auto space-y-2">
          <template x-for="room in rooms" :key="room.id">
            <div
              class="flex items-center rounded-xl border"
              :class="activeId===room.id ? 'bg-indigo-50 border-indigo-200 text-indigo-600' : 'bg-white border-transparent text-slate-500 hover:border-slate-200'"
            >
              <button
                @click="selectRoom(room.id)"
                :aria-current="activeId===room.id ? 'true' : 'false'"
                class="min-w-0 flex-1 p-3 text-left rounded-l-xl"
              >
                <span class="block truncate text-sm font-medium" x-text="room.title"></span>
                <span
                  class="block text-xs mt-2 opacity-60"
                  x-text="room.loading ? '답변 작성 중…' : room.messages.length + '개의 메시지'"
                ></span>
              </button>
              <button
                @click="deleteRoom(room.id)"
                :aria-label="room.title + ' 대화방 삭제'"
                title="대화방 삭제"
                class="mr-2 shrink-0 rounded-lg p-2 text-slate-400 hover:bg-red-50 hover:text-red-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-red-400"
              >
                <span class="icon icon-trash" aria-hidden="true"></span>
              </button>
            </div>
          </template>
        </div>
      </aside>
      <main class="flex-1 flex flex-col min-w-0">
        <header class="h-20 shrink-0 border-b border-slate-100 flex items-center justify-between px-6 md:px-10">
          <div class="flex items-center gap-3">
            <button class="lg:hidden" @click="roomsOpen=!roomsOpen" aria-label="대화방 목록 열기">☰</button
            ><span class="text-sm font-semibold">AI 어시스턴트</span
            ><span class="rounded-full bg-emerald-50 text-emerald-600 px-2 py-1 text-[10px]">● 온라인</span>
          </div>
          <div class="flex gap-4 items-center">
            <div class="theme-switch flex gap-1 rounded-xl bg-slate-100 p-1" role="group" aria-label="화면 테마 선택">
              <template
                x-for="option in [{value:'light',label:'Light',icon:'☀'},{value:'dark',label:'Dark',icon:'☾'},{value:'system',label:'System',icon:'▣'}]"
                :key="option.value"
              >
                <button
                  @click="setTheme(option.value)"
                  :aria-pressed="theme===option.value"
                  :aria-label="option.label"
                  :title="option.label"
                  class="cursor-pointer rounded-lg px-2 py-2 text-xs"
                  :class="theme===option.value ? 'theme-selected bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'"
                >
                  <span aria-hidden="true" x-text="option.icon"></span>
                  <span class="hidden sm:inline" x-text="option.label"></span>
                </button>
              </template>
            </div>
          </div>
        </header>
        <section class="flex-1 overflow-y-auto px-5" id="conversation" aria-live="polite">
          <div x-show="!messages.length" class="max-w-3xl mx-auto pt-14 md:pt-20 pb-8">
            <div
              class="w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 grid place-items-center text-indigo-600 text-4xl shadow-sm mb-7"
            >
              ✳
            </div>
            <h1 class="text-3xl md:text-[38px] font-semibold tracking-tight leading-tight">
              반가워요!<br /><span class="text-slate-400">오늘은 무엇을 함께 할까요?</span>
            </h1>
            <p class="text-sm text-slate-400 mt-5">작은 궁금증부터 커다란 아이디어까지, Orbit에게 이야기해 주세요.</p>
            <div class="grid sm:grid-cols-3 gap-3 mt-10">
              <template x-for="card in cards"
                ><button
                  @click="prompt=card.prompt;$refs.input.focus()"
                  class="card transition text-left border border-slate-200 rounded-xl p-5 bg-white"
                >
                  <span
                    class="w-9 h-9 rounded-lg grid place-items-center text-lg"
                    :class="card.color"
                    x-text="card.icon"
                  ></span>
                  <h2 class="font-semibold text-sm mt-5" x-text="card.title"></h2>
                  <p class="text-xs leading-5 text-slate-400 mt-2" x-text="card.desc"></p>
                  <div class="mt-4 text-slate-400 text-sm">↗</div>
                </button></template
              >
            </div>
            <div class="mt-7 flex flex-wrap gap-2 items-center text-xs text-slate-400">
              <span class="mr-1">이렇게 시작해 보세요</span
              ><button
                @click="prompt='이메일 초안을 작성해 주세요';$refs.input.focus()"
                class="border rounded-full px-3 py-1.5"
              >
                이메일 작성</button
              ><button
                @click="prompt='새로운 프로젝트 아이디어를 제안해 주세요';$refs.input.focus()"
                class="border rounded-full px-3 py-1.5"
              >
                아이디어 브레인스토밍</button
              ><button
                @click="prompt='긴 글을 핵심만 요약해 주세요';$refs.input.focus()"
                class="border rounded-full px-3 py-1.5"
              >
                텍스트 요약
              </button>
            </div>
          </div>
          <div x-cloak x-show="messages.length" class="max-w-3xl mx-auto py-10 space-y-7">
            <template x-for="message in messages"
              ><div class="flex gap-3" :class="message.role==='user'?'justify-end':''">
                <span
                  x-show="message.role==='assistant'"
                  class="bg-indigo-50 text-indigo-600 rounded-lg w-8 h-8 grid place-items-center shrink-0"
                  >✳</span
                >
                <div class="max-w-[85%]">
                  <div
                    class="text-sm leading-7 whitespace-pre-wrap rounded-2xl p-4"
                    :class="message.role==='user'?'bg-indigo-600 text-white':message.role==='error'?'bg-red-50 text-red-600 border border-red-200':'bg-slate-50 border border-slate-100'"
                    x-text="message.text"
                  ></div>
                  <button
                    x-show="message.role==='assistant'"
                    @click="navigator.clipboard.writeText(message.text);copied=true;setTimeout(()=>copied=false,1500)"
                    class="group relative mt-2 inline-flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500"
                    :aria-label="copied ? '복사했어요' : '복사'"
                  >
                    <span class="icon" :class="copied ? 'icon-check' : 'icon-copy'" aria-hidden="true"></span>
                    <span
                      role="tooltip"
                      class="pointer-events-none absolute bottom-full left-1/2 mb-1 -translate-x-1/2 whitespace-nowrap rounded-md bg-slate-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                      x-text="copied ? '복사했어요' : '복사'"
                    ></span>
                  </button>
                </div></div
            ></template>
            <p x-show="loading" class="text-sm text-indigo-500 animate-pulse">✳ 답변을 준비하고 있어요...</p>
          </div>
        </section>
        <div class="px-5 pb-5 pt-4">
          <form
            @submit.prevent="send()"
            class="max-w-3xl mx-auto border border-slate-200 rounded-2xl shadow-[0_4px_24px_#1e293b08] p-4 bg-white focus-within:border-indigo-300"
          >
            <textarea
              x-ref="input"
              x-model="prompt"
              @keydown.enter="if(!$event.isComposing && !$event.shiftKey){$event.preventDefault();send()}"
              :rows="Math.max(2, prompt.split('\n').length)"
              aria-label="메시지"
              placeholder="무엇이든 물어보세요. 함께 해결해 봐요. (Shift + Enter: 줄바꿈)"
              class="w-full resize-none text-sm outline-none placeholder:text-slate-400 leading-6"
            ></textarea>
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center gap-3">
                <div class="relative inline-flex">
                  <select
                    x-model="mode"
                    aria-label="응답 스타일"
                    class="cursor-pointer appearance-none bg-slate-50 border border-slate-100 rounded-lg py-2 pl-3 pr-9 text-xs text-slate-600"
                  >
                    <option>✧ 균형 잡힌 답변</option>
                    <option disabled>창의적인 답변</option>
                    <option disabled>간결한 답변</option>
                  </select>
                  <span
                    class="icon icon-chevron-down pointer-events-none absolute right-3 top-1/2 h-3 w-3 -translate-y-1/2 text-slate-400"
                    aria-hidden="true"
                  ></span>
                </div>
                <!-- <span class="hidden sm:block text-[10px] text-slate-400">데모 모드</span> -->
              </div>
              <button
                type="submit"
                :disabled="!prompt.trim()||loading"
                aria-label="메시지 보내기"
                class="w-7 h-7 rounded-full bg-indigo-600 text-white text-xl disabled:opacity-30"
              >
                ↑
              </button>
            </div>
          </form>
          <p class="text-center text-[10px] text-slate-400 mt-3">
            Orbit은 실수할 수 있어요. 중요한 정보는 다시 확인해 주세요.
            <span class="mx-1">·</span>
            <a href="https://www.penguinui.com/ai-components" class="text-indigo-500 hover:underline" target="_blank">
              Powered by Penguin UI
            </a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
