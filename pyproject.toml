[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "conventional-commits-check>=2.9.0",
    "fastapi>=0.162.0",
    "graphviz>=0.21",
    "kiwipiepy>=0.24.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-postgres>=0.0.19",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pre-commit>=4.6.2",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.16.1",
    "pygraphviz>=2.0.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
app = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
