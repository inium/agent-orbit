<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — AI Workspace</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="assets/js/app.js"></script>
    <link href="assets/fonts/pretendard/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body class="bg-white text-slate-800" x-data="orbitTheme">
    <div class="app-shell flex h-screen overflow-hidden" x-data="chatApp()">
      <aside
        class="w-64 shrink-0 border-r border-slate-200 bg-slate-50 p-4 flex-col fixed left-0 inset-y-0 z-20 lg:static"
        :class="roomsOpen ? 'flex' : 'hidden lg:flex'"
        aria-label="대화방 목록"
      >
        <a
          href="#"
          aria-label="Orbit"
          @click.prevent="$refs.input.focus()"
          class="brand flex flex-col items-start gap-2 px-2 pt-2 pb-8 text-xl font-semibold"
        >
          orbit
          <span class="brand-caption">사내 업무 안내</span>
        </a>
        <div class="flex items-center justify-between lg:hidden mb-4">
          <button @click="roomsOpen=false" class="lg:hidden text-slate-400" aria-label="대화방 목록 닫기">
            <span class="icon icon-close" aria-hidden="true"></span>
          </button>
        </div>
        <button
          @click="createRoom()"
          class="new-chat flex items-center justify-center gap-2 rounded-lg p-3 text-sm font-medium"
        >
          <span class="icon icon-plus" aria-hidden="true"></span> 새 대화
        </button>
        <div class="mt-6 flex-1 overflow-y-auto space-y-1">
          <template x-for="room in rooms" :key="room.id">
            <div
              class="flex items-center rounded-xl border"
              :class="activeId===room.id ? 'bg-slate-100 border-slate-200 text-slate-800' : 'bg-white border-transparent text-slate-500 hover:border-slate-200'"
            >
              <button
                @click="selectRoom(room.id)"
                :aria-current="activeId===room.id ? 'true' : 'false'"
                class="min-w-0 flex-1 p-3 text-left rounded-l-xl"
              >
                <span class="block truncate text-sm font-medium" x-text="room.title"></span>
                <span
                  class="block text-xs mt-1 text-slate-400"
                  x-text="room.loading ? '답변 작성 중…' : room.messages.length + '개의 메시지'"
                ></span>
              </button>
              <button
                @click="deleteRoom(room.id)"
                :aria-label="room.title + ' 대화방 삭제'"
                title="대화방 삭제"
                class="mr-2 shrink-0 rounded-lg p-2 text-slate-400 hover:bg-red-50 hover:text-red-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-red-400"
              >
                <span class="icon icon-trash" aria-hidden="true"></span>
              </button>
            </div>
          </template>
        </div>
      </aside>
      <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 shrink-0 border-b border-slate-100 flex items-center justify-between px-6 md:px-10">
          <div class="flex items-center gap-3">
            <button class="lg:hidden" @click="roomsOpen=!roomsOpen" aria-label="대화방 목록 열기">
              <span class="icon icon-menu" aria-hidden="true"></span></button
            ><span class="text-sm font-semibold">업무 안내 데스크</span
            ><span class="header-note hidden sm:inline text-xs text-slate-400">규정 · 매뉴얼</span>
          </div>
          <div class="flex gap-4 items-center">
            <div class="theme-switch flex gap-1 rounded-xl bg-slate-100 p-1" role="group" aria-label="화면 테마 선택">
              <template
                x-for="option in [{value:'light',label:'밝게',icon:'icon-sun'},{value:'dark',label:'어둡게',icon:'icon-moon'},{value:'system',label:'시스템',icon:'icon-monitor'}]"
                :key="option.value"
              >
                <button
                  @click="setTheme(option.value)"
                  :aria-pressed="theme===option.value"
                  :aria-label="option.label"
                  :title="option.label"
                  class="inline-flex items-center gap-2 rounded-lg p-2 text-xs"
                  :class="theme===option.value ? 'theme-selected bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'"
                >
                  <span class="icon" :class="option.icon" aria-hidden="true"></span>
                  <span class="hidden sm:inline" x-text="option.label"></span>
                </button>
              </template>
            </div>
          </div>
        </header>
        <section class="flex-1 min-h-0 overflow-y-auto px-6 md:px-8" id="conversation" aria-live="polite">
          <div x-show="!messages.length" class="welcome mx-auto pt-12 md:pt-16 pb-8">
            <p class="section-label text-xs text-slate-500 mb-4">Orbit / 길동상사 업무 안내</p>
            <h1 class="text-3xl md:text-4xl font-medium leading-tight">업무의 기준이 필요할 때</h1>
            <p class="text-sm text-slate-500 mt-4 leading-6">사내 규정과 쇼핑몰 매뉴얼에서 필요한 내용을 찾아보세요</p>
            <div class="service-grid grid grid-cols-2 sm:grid-cols-3 gap-3 mt-8">
              <template x-for="(card, index) in cards" :key="card.title"
                ><button
                  @click="prompt=card.prompt;$refs.input.focus()"
                  class="card text-left border border-slate-200 rounded-xl p-5 bg-white"
                >
                  <div class="card-index flex items-center justify-between text-slate-400">
                    <span class="tabular-nums" x-text="String(index + 1).padStart(2, '0')"></span>
                    <span class="icon icon-arrow-up-right" aria-hidden="true"></span>
                  </div>
                  <h2 class="font-medium text-sm mt-6" x-text="card.title"></h2>
                  <p class="text-sm leading-6 text-slate-500 mt-2" x-text="card.desc"></p></button
              ></template>
            </div>
            <div class="mt-6 flex flex-wrap gap-2 items-center text-xs text-slate-400">
              <span class="mr-1">다른 질문</span
              ><button
                @click="prompt='뉴욕과 런던의 현재 시간을 알려 주세요';$refs.input.focus()"
                class="border rounded-lg px-3 py-2"
              >
                해외 현재 시간</button
              ><button
                @click="prompt='어떤 업무를 도와줄 수 있는지 알려 주세요';$refs.input.focus()"
                class="border rounded-lg px-3 py-2"
              >
                도움받을 수 있는 일
              </button>
            </div>
          </div>
          <div x-cloak x-show="messages.length" class="conversation-content mx-auto py-8 space-y-8">
            <template x-for="message in messages"
              ><div class="flex gap-3" :class="message.role==='user'?'justify-end':''">
                <span
                  x-show="message.role==='assistant'"
                  class="assistant-mark rounded-lg w-8 h-8 grid place-items-center shrink-0"
                  ><span class="icon icon-book" aria-hidden="true"></span
                ></span>
                <div class="max-w-[85%]">
                  <div
                    class="text-sm leading-7 whitespace-pre-wrap rounded-2xl p-4"
                    :class="message.role==='user'?'user-message bg-slate-100 text-slate-800':message.role==='error'?'bg-red-50 text-red-600 border border-red-200':'bg-slate-50 border border-slate-100'"
                    x-text="message.text"
                  ></div>
                  <div
                    x-show="message.role==='assistant'"
                    x-data="{ usageVisible: false }"
                    x-id="['token-usage', 'usage-toggle-tooltip']"
                    class="mt-2 flex items-center gap-3"
                  >
                    <div class="flex shrink-0 items-center gap-1">
                      <button
                        @click="navigator.clipboard.writeText(message.text);copied=true;setTimeout(()=>copied=false,1500)"
                        class="group relative inline-flex shrink-0 h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500"
                        :aria-label="copied ? '복사했어요' : '복사'"
                      >
                        <span class="icon" :class="copied ? 'icon-check' : 'icon-copy'" aria-hidden="true"></span>
                        <span
                          role="tooltip"
                          class="pointer-events-none absolute bottom-full left-1/2 mb-1 -translate-x-1/2 whitespace-nowrap rounded-md bg-slate-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
                          x-text="copied ? '복사했어요' : '복사'"
                        ></span>
                      </button>
                      <button
                        type="button"
                        @click="usageVisible = !usageVisible"
                        :disabled="!message.usage"
                        :aria-expanded="usageVisible"
                        :aria-controls="$id('token-usage')"
                        :aria-describedby="$id('usage-toggle-tooltip')"
                        :aria-label="usageVisible ? '토큰 사용량 숨기기' : '토큰 사용량 보기'"
                        class="group relative inline-flex h-8 w-8 items-center justify-center rounded-lg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed"
                        :class="usageVisible ? 'bg-slate-100 text-slate-800 hover:bg-slate-100' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'"
                      >
                        <span
                          class="icon shrink-0"
                          style="--icon-url: url(/assets/icons/circle-info.svg)"
                          aria-hidden="true"
                        ></span>
                        <span
                          role="tooltip"
                          :id="$id('usage-toggle-tooltip')"
                          class="pointer-events-none invisible absolute bottom-full left-1/2 z-30 mb-1 -translate-x-1/2 whitespace-nowrap rounded-md bg-slate-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
                          x-text="usageVisible ? '토큰 사용량 숨기기' : '토큰 사용량 보기'"
                        ></span>
                      </button>
                    </div>
                    <template x-if="message.role==='assistant' && message.usage">
                      <p
                        x-cloak
                        x-show="usageVisible"
                        :id="$id('token-usage')"
                        class="min-w-0 text-xs leading-5 text-slate-400 tabular-nums"
                        aria-label="LLM 토큰 사용량"
                      >
                        <span>토큰 · </span>
                        <button
                          type="button"
                          x-id="['token-tooltip']"
                          :aria-describedby="$id('token-tooltip')"
                          class="group relative inline-block cursor-help rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500"
                        >
                          <span>입력 </span><span x-text="message.usage.input_tokens.toLocaleString('ko-KR')"></span>
                          <span
                            role="tooltip"
                            :id="$id('token-tooltip')"
                            class="pointer-events-none invisible absolute bottom-full right-0 z-30 mb-2 w-56 max-w-[60vw] rounded-md bg-slate-800 px-3 py-2 text-left text-xs font-normal leading-5 text-white opacity-0 transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
                            >질문, 이전 대화, 시스템 지침, 검색 문서 등을 AI에게 전달할 때 사용한 토큰 수예요.</span
                          >
                        </button>
                        <span aria-hidden="true"> · </span>
                        <button
                          type="button"
                          x-id="['token-tooltip']"
                          :aria-describedby="$id('token-tooltip')"
                          class="group relative inline-block cursor-help rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500"
                        >
                          <span>출력 </span><span x-text="message.usage.output_tokens.toLocaleString('ko-KR')"></span>
                          <span
                            role="tooltip"
                            :id="$id('token-tooltip')"
                            class="pointer-events-none invisible absolute bottom-full right-0 z-30 mb-2 w-56 max-w-[60vw] rounded-md bg-slate-800 px-3 py-2 text-left text-xs font-normal leading-5 text-white opacity-0 transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
                            >AI가 답변을 만들거나 도구를 호출할 때 사용한 토큰 수예요.</span
                          >
                        </button>
                        <span aria-hidden="true"> · </span>
                        <button
                          type="button"
                          x-id="['token-tooltip']"
                          :aria-describedby="$id('token-tooltip')"
                          class="group relative inline-block cursor-help rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-500"
                        >
                          <span>합계 </span><span x-text="message.usage.total_tokens.toLocaleString('ko-KR')"></span>
                          <span
                            role="tooltip"
                            :id="$id('token-tooltip')"
                            class="pointer-events-none invisible absolute bottom-full right-0 z-30 mb-2 w-56 max-w-[60vw] rounded-md bg-slate-800 px-3 py-2 text-left text-xs font-normal leading-5 text-white opacity-0 transition-opacity group-hover:visible group-hover:opacity-100 group-focus-visible:visible group-focus-visible:opacity-100"
                            >이번 요청에서 모든 에이전트가 사용한 입력·출력 토큰을 더한 값이에요. 임베딩 토큰은 포함되지
                            않아요.</span
                          >
                        </button>
                      </p>
                    </template>
                  </div>
                </div>
              </div></template
            >
            <p x-show="loading" class="text-sm text-slate-500 motion-safe:animate-pulse" role="status">
              자료를 확인하고 있습니다…
            </p>
          </div>
        </section>
        <div class="composer-area px-6 md:px-8 pb-4 pt-4">
          <form @submit.prevent="send()" class="composer mx-auto border border-slate-200 rounded-2xl p-4 bg-white">
            <textarea
              x-ref="input"
              x-model="prompt"
              @keydown.enter="if(!$event.isComposing && !$event.shiftKey){$event.preventDefault();send()}"
              :rows="Math.max(2, prompt.split('\n').length)"
              aria-label="메시지"
              placeholder="업무 질문이나 요약할 텍스트를 입력하세요"
              class="w-full resize-none text-sm outline-none placeholder:text-slate-400 leading-6"
            ></textarea>
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center gap-3">
                <div class="relative inline-flex">
                  <select
                    x-model="mode"
                    aria-label="응답 스타일"
                    class="cursor-pointer appearance-none bg-slate-50 border border-slate-100 rounded-lg py-2 pl-3 pr-9 text-xs text-slate-600"
                  >
                    <option value="균형 잡힌 답변">균형 잡힌 답변</option>
                    <option disabled>창의적인 답변</option>
                    <option disabled>간결한 답변</option>
                  </select>
                  <span
                    class="icon icon-chevron-down pointer-events-none absolute right-3 top-1/2 h-3 w-3 -translate-y-1/2 text-slate-400"
                    aria-hidden="true"
                  ></span>
                </div>
              </div>
              <span class="hidden sm:inline text-xs text-slate-400 pt-2">
                줄바꿈 <kbd>Shift</kbd> + <kbd>Enter</kbd>
              </span>
              <button
                type="submit"
                :disabled="!prompt.trim()||loading"
                aria-label="메시지 보내기"
                class="send-button w-8 h-8 rounded-lg bg-indigo-600 text-white inline-flex items-center justify-center disabled:opacity-30"
              >
                <span class="icon icon-arrow-up" aria-hidden="true"></span>
              </button>
            </div>
          </form>
          <p class="composer-note text-center text-xs text-slate-400 mt-3 leading-5">
            중요한 업무 판단에는 답변의 원문 근거를 확인하세요
            <span class="mx-1">·</span>
            <a
              href="https://www.penguinui.com/ai-components"
              class="text-indigo-500 hover:underline"
              target="_blank"
              rel="noopener noreferrer"
            >
              Powered by Penguin UI
            </a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
